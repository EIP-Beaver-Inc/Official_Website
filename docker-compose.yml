services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - MONGO_URL=${MONGO_URL}
      - DB_NAME=${DB_NAME}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - NOTIFY_EMAIL_TO=${NOTIFY_EMAIL_TO:-beaver.eip@gmail.com}
      # BETA software licenses (docs/beta-keys.md). Secrets: set them in .env only.
      - BETA_KEY_PEPPER=${BETA_KEY_PEPPER:-}
      - BETA_SIGNING_PRIVATE_KEY=${BETA_SIGNING_PRIVATE_KEY:-}
      - BETA_SIGNING_KID=${BETA_SIGNING_KID:-}
      - BETA_MODEL_KEYS=${BETA_MODEL_KEYS:-}
      - BETA_DURATION_DAYS=${BETA_DURATION_DAYS:-14}
      - BETA_REDEEM_WINDOW_DAYS=${BETA_REDEEM_WINDOW_DAYS:-30}
      - BETA_MAX_MACHINES=${BETA_MAX_MACHINES:-2}
      - BETA_MAX_DOWNLOADS=${BETA_MAX_DOWNLOADS:-5}
      - BETA_CHECK_INTERVAL_SECONDS=${BETA_CHECK_INTERVAL_SECONDS:-900}
      - BETA_DOWNLOAD_URL_TTL_SECONDS=${BETA_DOWNLOAD_URL_TTL_SECONDS:-600}
      - BETA_PUBLIC_BASE_URL=${BETA_PUBLIC_BASE_URL:-}
      - BETA_RELEASES_DIR=/data/beta-releases
    volumes:
      # Private storage for the beta binaries (never served statically).
      - beta_releases:/data/beta-releases
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_BACKEND_URL=
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  mongo_data:
  beta_releases:
  caddy_data:
  caddy_config:
