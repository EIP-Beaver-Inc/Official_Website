services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - MONGO_URL=${MONGO_URL}
      - DB_NAME=${DB_NAME}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - NOTIFY_EMAIL_TO=${NOTIFY_EMAIL_TO:-beaver.eip@gmail.com}
      # Licences : clé privée de signature (python backend/licensing.py generate). SECRÈTE.
      - LICENCE_PRIVATE_KEY=${LICENCE_PRIVATE_KEY:-}
      # Adresse publique du site, pour les liens envoyés par mail.
      - SITE_URL=${SITE_URL:-https://beaver-website.fr}
      # Installateurs BeaverSetup-x.y.z.exe servis aux clients (le plus récent).
      - RELEASES_DIR=/releases
      - DOWNLOAD_LINK_DAYS=${DOWNLOAD_LINK_DAYS:-30}
    volumes:
      - ./releases:/releases:ro
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_BACKEND_URL=
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
